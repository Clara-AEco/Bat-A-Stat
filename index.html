<script>
window.onerror = function(msg, src, line, col, err) {
  document.body.innerHTML = '<pre style="color:#fff;background:#900;padding:16px;white-space:pre-wrap;font-size:14px;">JS ERROR:\n' + msg + '\nat ' + src + ':' + line + ':' + col + '\n' + (err && err.stack || '') + '</pre>';
};
</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bat-A-Stat</title>
<style>
:root {
  --bg: #14171a; --bg-elevated: #1e2227; --bg-card: #232830; --border: #353c45;
  --text: #eef1f4; --text-muted: #9aa5b1; --text-faint: #6b7480;
  --accent: #e8833a; --accent-dim: #5a4128; --accent-text: #1a1208;
  --teal: #4fb8a8; --teal-dim: #1f3d38; --danger: #e85a6a; --danger-dim: #3d2226;
  --radius: 10px; --radius-lg: 16px;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-body); height:100%; }
#root { height:100vh; }
.app-shell { display:flex; height:100vh; }

/* ---- Sidebar ---- */
.sidebar { width:300px; flex-shrink:0; background:var(--bg-elevated); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-app-name { font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:0.02em; }
.sidebar-app-sub { font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px; font-family:var(--font-mono); }
.sidebar-section { padding:12px; border-bottom:1px solid var(--border); }
.sidebar-section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); padding:0 4px 8px; display:flex; align-items:center; justify-content:space-between; }
.tree { display:flex; flex-direction:column; gap:2px; }
.tree-node { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-muted); }
.tree-node:hover { background:var(--bg-card); }
.tree-node-active { background:var(--accent-dim); color:var(--accent); font-weight:600; }
.tree-node-location { font-weight:600; color:var(--text); }
.tree-indent { padding-left:20px; }
.tree-add-btn { background:none; border:1px dashed var(--border); color:var(--text-faint); border-radius:8px; padding:6px 8px; font-size:12px; cursor:pointer; text-align:left; width:100%; margin-top:2px; }
.tree-add-btn:hover { color:var(--accent); border-color:var(--accent-dim); }

/* ---- Main content ---- */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.main-header { padding:16px 24px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; justify-content:space-between; }
.main-title { font-family:var(--font-display); font-weight:700; font-size:20px; }
.main-subtitle { font-size:12px; color:var(--text-muted); margin-top:3px; font-family:var(--font-mono); }
.main-actions { display:flex; gap:8px; }
.tab-bar { display:flex; gap:2px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--bg-elevated); overflow-x:auto; }
.tab-btn { padding:12px 14px; background:none; border:none; border-bottom:2px solid transparent; color:var(--text-faint); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:var(--font-body); }
.tab-btn-active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-btn:disabled { color:var(--border); cursor:not-allowed; }
.content { flex:1; overflow-y:auto; padding:24px; max-width:1000px; }

/* ---- Shared bits ---- */
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
.card-list { display:flex; flex-direction:column; gap:8px; }
.card-title { font-family:var(--font-display); font-weight:600; font-size:15px; }
.card-sub { font-size:12px; color:var(--text-muted); margin-top:3px; font-family:var(--font-mono); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-body); font-weight:600; font-size:13px; padding:9px 14px; border-radius:var(--radius); border:1px solid transparent; cursor:pointer; }
.btn:active { transform:scale(0.98); }
.btn-primary { background:var(--accent); color:var(--accent-text); }
.btn-secondary { background:var(--bg-card); color:var(--text); border-color:var(--border); }
.btn-danger { background:var(--danger-dim); color:var(--danger); border-color:var(--danger); }
.btn-small { padding:6px 10px; font-size:12px; }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.field label { font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; }
.field input, .field textarea, .field select {
  background:var(--bg-card); border:1px solid var(--border); border-radius:8px; color:var(--text);
  padding:9px 10px; font-family:var(--font-body); font-size:14px;
}
.field input:focus, .field textarea:focus, .field select:focus { outline:1px solid var(--accent); }
.field-row { display:flex; gap:14px; }
.field-row .field { flex:1; }
.section-title { font-family:var(--font-display); font-weight:600; font-size:15px; margin:24px 0 10px; }
.section-title:first-child { margin-top:0; }
.empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; padding:80px 24px; color:var(--text-muted); }
.empty-title { font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--text); margin-bottom:6px; }
.empty-text { font-size:13px; line-height:1.5; max-width:360px; }
.modal-overlay { position:fixed; inset:0; background:rgba(10,12,14,0.7); display:flex; align-items:center; justify-content:center; z-index:5000; }
.modal { background:var(--bg-elevated); border-radius:var(--radius-lg); width:100%; max-width:440px; border:1px solid var(--border); padding:20px; }
.modal-title { font-family:var(--font-display); font-weight:600; font-size:16px; margin-bottom:14px; }
.modal-actions { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
.pill { font-size:10px; font-weight:700; padding:3px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:0.05em; background:var(--bg-card); color:var(--text-faint); border:1px solid var(--border); }
.pill-coming-soon { background:rgba(232,131,58,0.1); color:var(--accent); border-color:var(--accent-dim); }
.badge-count { background:var(--bg); color:var(--text-faint); font-size:10px; padding:1px 7px; border-radius:100px; font-family:var(--font-mono); }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:10px; margin-top:8px; }
.stat-box { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:12px; }
.stat-box-label { font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; }
.stat-box-value { font-family:var(--font-display); font-size:20px; font-weight:700; margin-top:4px; }
</style>
</head>

<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="models.js"></script>
<script src="storage.js"></script>
<script src="bto.js"></script>
<script src="wav.js"></script>
<script src="dsp.js"></script>
<script src="species-data.js"></script>
<script src="emergence-data.js"></script>
<script src="qa-profiles.js"></script>
<script src="sun.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
